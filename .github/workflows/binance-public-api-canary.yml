name: Binance Public API Canary

on:
  schedule:
    - cron: "47 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binance-public-api-canary
  cancel-in-progress: false

jobs:
  live-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11.16
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked runtime dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Check public Binance response schemas
        run: python -m scripts.check_binance_public_api
