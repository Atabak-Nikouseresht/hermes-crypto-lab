name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11.16'
          # Python 3.11.9 is the newest 3.11 patch published for
          # actions/setup-python on Windows runners.
          - os: windows-latest
            python-version: '3.11.9'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Compile source, entry points, scripts and tests
        run: >-
          python -m compileall -q src tests scripts
          run_backtest.py run_data_pipeline.py run_experiments.py
          run_monthly_report.py run_paper.py

      - name: Verify public-only execution boundary
        run: python scripts/verify_safety.py

      - name: Verify portable scheduler manifest and wrapper hashes
        run: python scripts/verify_scheduler_manifest.py

      - name: Verify Markdown local links
        run: python scripts/check_markdown_links.py

      - name: Audit locked dependencies
        run: python -m pip_audit -r requirements.lock

      - name: Verify governance and locked strategy
        run: >-
          python -c "from pathlib import Path;
          from run_paper import load_paper_configuration;
          from src.forward_governance import economic_spec_hash_v2, locked_strategy_hash, verify_trust_anchors;
          root=Path('.').resolve();
          config,_=load_paper_configuration(root);
          assert locked_strategy_hash(config)=='29451632091c5cf6d33cd58a03a2bd5a1bf52297a21375b9ae5e5b6fbbbac2d6';
          assert economic_spec_hash_v2(config)=='1dc381ce5e8c663b1e1aab496503837945547d77944d082f873eab8f127eb395';
          verify_trust_anchors(root,config);
          print('PASS: locked strategy and trust anchors verified')"

      - name: Verify active hardening manifest
        run: >-
          python -c "from pathlib import Path;
          from src.hardening_manifest import verify_hardening_manifest;
          print(verify_hardening_manifest(Path('.'), Path('forward_experiment/hardening_manifest.json')))"

      - name: Run unit, property and integration tests
        run: python -m pytest tests -q
