name: CI

on:
  pull_request:
  push:

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11.16'
          # Python 3.11.9 is the newest 3.11 patch published for
          # actions/setup-python on Windows runners.
          - os: windows-latest
            python-version: '3.11.9'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Scan secrets in pull request or push
        if: runner.os == 'Linux'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Remove the action's generated SARIF file before tree scan
        run: python -c "from pathlib import Path; Path('results.sarif').unlink(missing_ok=True)"

      - name: Scan checked-out repository contents
        if: runner.os == 'Linux'
        run: >-
          gitleaks dir . --redact --no-banner --config .gitleaks.toml
          --exit-code=2 --report-format=json
          --report-path="${{ runner.temp }}/gitleaks-worktree.json"

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Compile source, entry points, scripts and tests
        run: >-
          python -m compileall -q src tests scripts
          run_backtest.py run_data_pipeline.py run_experiments.py
          run_monthly_report.py run_paper.py

      - name: Run static quality gate
        run: python -m ruff check .

      - name: Run scoped static typing
        run: python -m mypy

      - name: Run standard security lint
        run: >-
          python -m ruff check src run_backtest.py run_data_pipeline.py
          run_experiments.py run_monthly_report.py run_paper.py scripts
          --select S --ignore S101,S603,S607,S310

      - name: Verify public-only execution boundary
        run: python scripts/verify_safety.py

      - name: Verify portable scheduler manifest and wrapper hashes
        run: python scripts/verify_scheduler_manifest.py

      - name: Verify frozen sealed V1 research artifacts
        run: >-
          python scripts/sealed_v1_manifest.py
          --expected-sha256 5f5ad2ba69c9b0283bb925399c8a2815f73502a94b671a5c3c43ed26869079d8

      - name: Verify Markdown local links
        run: python scripts/check_markdown_links.py

      - name: Audit locked dependencies
        run: python -m pip_audit -r requirements.lock

      - name: Verify governance and locked strategy
        run: >-
          python -c "from pathlib import Path;
          from run_paper import load_paper_configuration;
          from src.forward_governance import economic_spec_hash_v2, locked_strategy_hash, verify_trust_anchors;
          root=Path('.').resolve();
          config,_=load_paper_configuration(root);
          assert locked_strategy_hash(config)=='29451632091c5cf6d33cd58a03a2bd5a1bf52297a21375b9ae5e5b6fbbbac2d6';
          assert economic_spec_hash_v2(config)=='1dc381ce5e8c663b1e1aab496503837945547d77944d082f873eab8f127eb395';
          verify_trust_anchors(root,config);
          print('PASS: locked strategy and trust anchors verified')"

      - name: Verify active hardening manifest
        run: python -m scripts.verify_hardening_manifest

      - name: Run unit, property and integration tests
        run: >-
          python -m pytest tests -q
          --cov=src
          --cov=run_paper
          --cov=scripts.paper_forward_monthly
          --cov-branch
          --cov-report=term
          --cov-fail-under=75

      - name: Enforce critical-path coverage floors
        run: |
          python -m coverage report --precision=2 --include=run_paper.py --fail-under=80
          python -m coverage report --precision=2 --include=src/paper_forward.py --fail-under=80
          python -m coverage report --precision=2 --include=src/paper_broker.py --fail-under=85
          python -m coverage report --precision=2 --include=src/paper_store.py --fail-under=85
          python -m coverage report --precision=2 --include=src/forward_operations.py --fail-under=85
          python -m coverage report --precision=2 --include=src/statistical_diagnostics.py --fail-under=80
          python -m coverage report --precision=2 --include=src/download_data.py --fail-under=80
          python -m coverage report --precision=2 --include=src/experiment_runner.py --fail-under=80
          python -m coverage report --precision=2 --include=src/research_data.py --fail-under=85
          python -m coverage report --precision=2 --include=scripts/paper_forward_monthly.py --fail-under=80
          python -m coverage report --precision=2 --include=src/forward_governance.py --fail-under=80
          python -m coverage report --precision=2 --include=src/paper_notifications.py --fail-under=82
          python -m coverage report --precision=2 --include=src/backup_restore.py --fail-under=78
          python -m coverage report --precision=2 --include=src/paper_market.py --fail-under=80
          python -m coverage report --precision=2 --include=src/scheduler_contract.py --fail-under=70
          python -m coverage report --precision=2 --include=src/forward_counterfactual.py --fail-under=80

      - name: Test Gitleaks canary and hash policy
        env:
          HCL_REQUIRE_GITLEAKS: "1"
        run: python -m pytest tests/test_secret_scanner.py -q
