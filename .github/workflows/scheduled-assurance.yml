name: Scheduled Security Assurance

on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: scheduled-security-assurance
  cancel-in-progress: false

jobs:
  assurance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.11.16
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-quality.lock

      - name: Scan repository with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Scan all fetched Git history
        run: >-
          gitleaks detect --redact --no-banner --config .gitleaks.toml
          --log-opts=--all --exit-code=2 --report-format=json
          --report-path="$RUNNER_TEMP/gitleaks-history.json"

      - name: Install hash-locked runtime dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Install hash-locked quality dependencies
        run: python -m pip install --require-hashes -r requirements-quality.lock

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Audit hash-locked runtime dependencies
        run: python -m pip_audit -r requirements.lock

      - name: Audit hash-locked quality dependencies
        run: python -m pip_audit -r requirements-quality.lock

      - name: Verify public-only execution boundary
        run: python scripts/verify_safety.py

      - name: Verify portable scheduler manifest and wrapper hashes
        run: python scripts/verify_scheduler_manifest.py

      - name: Verify active hardening manifest
        run: python -m scripts.verify_hardening_manifest

      - name: Verify locked strategy and trust anchors
        run: >-
          python -c "from pathlib import Path;
          from run_paper import load_paper_configuration;
          from src.forward_governance import economic_spec_hash_v2, locked_strategy_hash, verify_trust_anchors;
          root=Path('.').resolve();
          config,_=load_paper_configuration(root);
          assert locked_strategy_hash(config)=='29451632091c5cf6d33cd58a03a2bd5a1bf52297a21375b9ae5e5b6fbbbac2d6';
          assert economic_spec_hash_v2(config)=='1dc381ce5e8c663b1e1aab496503837945547d77944d082f873eab8f127eb395';
          verify_trust_anchors(root,config);
          print('PASS: locked strategy and trust anchors verified')"

      - name: Verify frozen sealed V1 research artifacts
        run: >-
          python scripts/sealed_v1_manifest.py
          --expected-sha256 5f5ad2ba69c9b0283bb925399c8a2815f73502a94b671a5c3c43ed26869079d8

      - name: Run bounded mutation testing
        timeout-minutes: 50
        run: python -m mutmut run

      - name: Enforce bounded mutation-score floor
        run: python scripts/verify_mutation_score.py --minimum-score 80
