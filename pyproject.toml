[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Conservative correctness checks: syntax/indentation, Pyflakes, and Bugbear.
# B904/B905 are enabled and fixed rather than suppressed.
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_hardening_manifest.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
