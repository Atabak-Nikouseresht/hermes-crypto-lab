[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Conservative correctness checks: syntax/indentation, Pyflakes, and Bugbear.
# B904/B905 are enabled and fixed rather than suppressed.
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_hardening_manifest.py" = ["E402"]
