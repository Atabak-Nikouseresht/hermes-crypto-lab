[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Adopt a stable, low-noise correctness baseline without rewriting historical
# research code for style. Broader rule families can be enabled incrementally.
select = ["E4", "E7", "E9"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_hardening_manifest.py" = ["E402"]
