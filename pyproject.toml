[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Conservative correctness checks: syntax/indentation, Pyflakes, and Bugbear.
# B904/B905 are enabled and fixed rather than suppressed.
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_hardening_manifest.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true
files = [
    "src/validate_data.py",
    "src/storage.py",
    "src/hardening_manifest.py",
    "src/config_validation.py",
    "src/config.py",
    "src/costs.py",
    "src/metrics.py",
    "src/schedule.py",
    "src/scheduler_contract.py",
    "src/scheduler_deployment.py",
    "src/data_integrity.py",
    "src/release_provenance.py",
    "src/forward_counterfactual.py",
    "src/paper_notifications.py",
]
# Analyze the explicitly listed targets without expanding the bounded scope into
# legacy imports; errors in every target remain visible.
follow_imports = "silent"
